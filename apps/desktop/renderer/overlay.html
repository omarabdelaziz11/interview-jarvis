<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jarvis Overlay</title>
    <link rel="stylesheet" href="./overlay.css" />
    <script src="./overlay.js" defer></script>
  </head>
  <body>
    <main class="overlay" aria-label="Jarvis assistant">
      <header class="header">
        <div class="header-drag">
          <p class="eyebrow" id="brand-label">Jarvis</p>
          <div class="status">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="status-text">Idle</span>
          </div>
        </div>
        <div class="header-actions">
          <div class="mode-switch" role="group" aria-label="Assistant mode">
            <button class="mode-chip active" type="button" data-mode="jarvis">Jarvis</button>
            <button class="mode-chip" type="button" data-mode="interview">Interview</button>
          </div>
          <button
            type="button"
            id="close-button"
            class="close-button"
            aria-label="Quit app"
            title="Quit"
          >
            ×
          </button>
        </div>
      </header>

      <section class="heard" id="heard" aria-live="polite" hidden>
        <span>Heard</span>
        <p id="heard-text"></p>
      </section>

      <section class="messages" id="messages" aria-label="Conversation" aria-live="polite">
        <div class="empty-state" id="empty-state">
          <p>Ready when you are.</p>
          <span>Your conversation will appear here.</span>
        </div>
      </section>

      <div class="error-row" id="error-row" hidden>
        <p class="error" id="error" role="alert"></p>
        <button type="button" id="retry-button" hidden>Retry</button>
      </div>

      <footer class="controls" id="controls">
        <!-- TTS disabled for now — Mute only controlled speech playback
        <button type="button" id="mute-button" aria-pressed="false">Mute</button>
        -->
        <button type="button" id="listen-button" aria-pressed="false">Listen</button>
        <button type="button" id="scan-button" hidden>Scan screen</button>
        <button type="button" id="clear-button">Clear</button>
        <button type="button" id="copy-button">Copy</button>
        <button type="button" id="settings-button">Settings</button>
        <button type="button" id="hide-button">Hide</button>
      </footer>
    </main>
  </body>
</html>
